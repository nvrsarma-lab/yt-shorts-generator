<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YouTube Shorts AI Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0f172a;
padding:20px;
color:white;
}

.container{
max-width:1000px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:30px;
}

.header h1{
font-size:42px;
color:#ffffff;
}

.header p{
color:#94a3b8;
margin-top:10px;
}

.card{
background:#1e293b;
padding:25px;
border-radius:20px;
box-shadow:0 0 25px rgba(0,0,0,.25);
}

input{
width:100%;
padding:14px;
margin-top:12px;
background:#0f172a;
border:1px solid #334155;
border-radius:12px;
color:white;
font-size:16px;
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;
background:#ff0000;
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.copyBtn{
background:#2563eb;
}

.downloadBtn{
background:#16a34a;
}

.status{
margin-top:15px;
font-weight:600;
}

.output{
margin-top:25px;
background:#0f172a;
padding:25px;
border-radius:15px;
line-height:1.8;
white-space:pre-wrap;
min-height:250px;
border:1px solid #334155;
overflow:auto;
}

.output h1,
.output h2,
.output h3{
margin-top:15px;
margin-bottom:10px;
color:#38bdf8;
}

.loader{
display:none;
margin-top:20px;
text-align:center;
}

.spinner{
width:40px;
height:40px;
border:4px solid #334155;
border-top:4px solid #38bdf8;
border-radius:50%;
animation:spin 1s linear infinite;
margin:auto;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🎬 YouTube Shorts AI Generator</h1>
<p>Create Viral Shorts Stories, Voiceovers & Scene Prompts</p>
</div>

<div class="card">

<input
id="topic"
placeholder="Enter Story Topic">

<input
id="scenes"
type="number"
placeholder="Number of Scenes">

<button onclick="generateStory()">
🚀 Generate Story
</button>

<button class="copyBtn" onclick="copyStory()">
📋 Copy Story
</button>

<button class="downloadBtn" onclick="downloadStory()">
📥 Download TXT
</button>

<div id="status" class="status"></div>

<div class="loader" id="loader">
<div class="spinner"></div>
<p>Generating AI Content...</p>
</div>

<div id="output" class="output">
Generated story will appear here...
</div>

</div>

</div>

<script>

function formatContent(text){

return text
.replace(/^# (.*)$/gm,'<h1>$1</h1>')
.replace(/^## (.*)$/gm,'<h2>$1</h2>')
.replace(/^### (.*)$/gm,'<h3>$1</h3>')
.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
.replace(/\n/g,'<br>');

}

async function generateStory(){

const topic =
document.getElementById("topic").value;

const scenes =
document.getElementById("scenes").value;

const output =
document.getElementById("output");

const loader =
document.getElementById("loader");

const status =
document.getElementById("status");

if(!topic){
alert("Enter a topic");
return;
}

loader.style.display="block";

status.innerHTML="";

output.innerHTML="";

const prompt = `
Create a viral YouTube Shorts story.

Topic: ${topic}

Number of Scenes: ${scenes}

Generate:

1. Powerful Hook
2. Full Story
3. Telugu Voiceover
4. Scene Breakdown
5. Scene Prompts
6. Strong CTA

Use engaging storytelling.
`;

try{

const response = await fetch(
"https://yt-shorts-api.nvrsarma.workers.dev/",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
prompt:prompt
})
}
);

const data = await response.json();

loader.style.display="none";

if(
data.choices &&
data.choices.length > 0
){

const story =
data.choices[0].message.content;

output.innerHTML =
formatContent(story);

status.innerHTML =
"✅ Story Generated Successfully";

}else{

output.innerHTML =
"<pre>" +
JSON.stringify(data,null,2) +
"</pre>";

status.innerHTML =
"⚠ API Response Received";

}

}catch(error){

loader.style.display="none";

status.innerHTML =
"❌ Error";

output.innerHTML =
error.message;

}

}

function copyStory(){

const text =
document.getElementById("output").innerText;

navigator.clipboard.writeText(text);

alert("Story Copied");
}

function downloadStory(){

const text =
document.getElementById("output").innerText;

const blob =
new Blob([text],{
type:"text/plain"
});

const a =
document.createElement("a");

a.href =
URL.createObjectURL(blob);

a.download =
"youtube-short-story.txt";

a.click();

}

</script>

</body>
</html>
