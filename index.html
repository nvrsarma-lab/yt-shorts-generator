<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YouTube Shorts AI Generator</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: auto;
    padding: 20px;
    background: #f4f4f4;
}

h1{
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    font-size:16px;
    cursor:pointer;
}

textarea{
    width:100%;
    height:400px;
    margin-top:10px;
    box-sizing:border-box;
}
</style>
</head>

<body>

<h1>YouTube Shorts AI Generator</h1>

<input
id="topic"
placeholder="Enter Story Topic">

<input
id="scenes"
type="number"
placeholder="Number of Scenes">

<button onclick="generateStory()">
Generate Story
</button>

<textarea
id="output"
placeholder="Generated story will appear here...">
</textarea>

<script>

async function generateStory(){

    const topic =
    document.getElementById("topic").value;

    const scenes =
    document.getElementById("scenes").value;

    const output =
    document.getElementById("output");

    if(!topic){
        output.value =
        "Please enter a story topic.";
        return;
    }

    output.value = "Generating...";

    const prompt = `
Create a viral YouTube Shorts story.

Topic: ${topic}

Number of Scenes: ${scenes}

Generate:

1. Full Story
2. Telugu Voiceover
3. Scene Breakdown
4. Scene Prompts
5. Strong CTA
`;

    try{

        const response = await fetch(
        "https://yt-shorts-api.nvrsarma.workers.dev/",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                prompt: prompt
            })
        });

        const data = await response.json();

        if(data.candidates){
            output.value =
            data.candidates[0].content.parts[0].text;
        }else{
            output.value =
            JSON.stringify(data,null,2);
        }

    }catch(error){

        output.value =
        "Error: " + error.message;

    }

}
</script>

</body>
</html>
