<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YouTube Shorts & Video Studio AI</title>
  <style>
    :root {
      --primary: #ff0000;
      --primary-hover: #cc0000;
      --bg: #0f0f0f;
      --card-bg: #1f1f1f;
      --text: #ffffff;
      --text-muted: #aaaaaa;
      --accent: #22c55e;
      --border: #333333;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px;
      line-height: 1.5;
    }

    h1 { color: var(--primary); text-align: center; margin-bottom: 5px; }
    .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 30px; }

    .input-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 30px;
    }

    .form-group { margin-bottom: 15px; }
    .form-row { display: flex; gap: 15px; }
    .form-row .form-group { flex: 1; }

    label { font-weight: 600; display: block; margin-bottom: 8px; color: #ddd; }

    input, select {
      width: 100%;
      padding: 12px 16px;
      background-color: #121212;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      box-sizing: border-box;
    }

    .topic-wrapper {
      display: flex;
      gap: 10px;
    }

    button.random-btn {
      background-color: #333;
      color: white;
      border: 1px solid var(--border);
      padding: 0 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }
    button.random-btn:hover { background-color: #444; }

    button.gen-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: white;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    button.gen-btn:hover { background-color: var(--primary-hover); }
    button.gen-btn:disabled { background-color: #555; cursor: not-allowed; }

    .tabs-container { display: none; margin-top: 20px; }
    .tabs-header { display: flex; gap: 8px; border-bottom: 2px solid var(--border); overflow-x: auto; padding-bottom: 8px; }

    .tab-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
    }

    .tab-btn.active { background-color: var(--primary); color: white; border-color: var(--primary); }

    .tab-content {
      display: none;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 12px 12px;
      padding: 24px;
      min-height: 250px;
    }

    .tab-content.active { display: block; }

    .scene-box { border: 1px solid var(--border); background-color: #161616; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .scene-title { color: var(--primary); font-weight: bold; margin-bottom: 8px; }
    .badge { display: inline-block; padding: 4px 8px; background: #333; border-radius: 4px; font-size: 12px; margin-bottom: 8px; }
    .telugu-text { font-size: 18px; line-height: 1.8; color: #38bdf8; font-family: 'Gautami', 'Mandali', sans-serif; }
    .char-card { border-left: 4px solid var(--accent); background: #181818; padding: 12px 16px; margin-bottom: 12px; border-radius: 0 8px 8px 0; }
    .loading-spinner { text-align: center; padding: 40px; color: var(--text-muted); display: none; }
  </style>
</head>
<body>

  <h1>🎬 YouTube Studio AI</h1>
  <p class="subtitle">Generate Telugu & English scripts, voiceovers, character sheets & scene breakdowns</p>

  <div class="input-card">
    <div class="form-group">
      <label for="topic">Topic / Story Idea:</label>
      <div class="topic-wrapper">
        <input type="text" id="topic" placeholder="e.g., The secret kingdom of Vijayanagara">
        <button class="random-btn" onclick="generateRandomTopic()">🎲 Random Topic</button>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="duration">Target Duration:</label>
        <select id="duration">
          <option value="30s">30 Seconds (Fast Short)</option>
          <option value="60s" selected>60 Seconds (Standard Short)</option>
          <option value="3m">Up to 3 Minutes (In-Depth Video)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="language">Primary Voiceover Language:</label>
        <select id="language">
          <option value="Telugu" selected>Telugu (తెలుగు - Native Script)</option>
          <option value="English">English</option>
        </select>
      </div>

      <div class="form-group">
        <label for="tone">Tone:</label>
        <select id="tone">
          <option value="dramatic">Dramatic / Cinematic</option>
          <option value="engaging">Engaging / Energetic</option>
          <option value="educational">Educational / Historical</option>
          <option value="mysterious">Mysterious / Thrilling</option>
        </select>
      </div>
    </div>

    <button class="gen-btn" onclick="generateShort()" id="genBtn">Generate Studio Assets</button>
  </div>

  <div class="loading-spinner" id="spinner">
    ⏳ Generating full story assets, voiceover audio scripts, and scene breakdowns...
  </div>

  <div class="tabs-container" id="tabsContainer">
    <div class="tabs-header">
      <button class="tab-btn active" onclick="switchTab('tab-story', event)">📖 Full Story</button>
      <button class="tab-btn" onclick="switchTab('tab-lang', event)">🎙️ Voiceover Script</button>
      <button class="tab-btn" onclick="switchTab('tab-scenes', event)">🎬 Scene Breakdown</button>
      <button class="tab-btn" onclick="switchTab('tab-chars', event)">👤 Character Sheets</button>
      <button class="tab-btn" onclick="switchTab('tab-hook', event)">🪝 Hook & CTA</button>
    </div>

    <div id="tab-story" class="tab-content active"></div>
    <div id="tab-lang" class="tab-content"></div>
    <div id="tab-scenes" class="tab-content"></div>
    <div id="tab-chars" class="tab-content"></div>
    <div id="tab-hook" class="tab-content"></div>
  </div>

  <script>
    const sampleTopics = [
      "The incredible secrets of Vijayanagara's musical pillars",
      "The hidden treasure chambers beneath Padmanabhaswamy Temple",
      "5 Bizarre facts about Black Holes that physics can't explain",
      "How Ancient Indian builders created everlasting rock-cut temples",
      "The mysterious disappearance of Flight 19 in the Bermuda Triangle",
      "What happens to your human mind during sleep paralysis",
      "How Artificial Intelligence will change our daily lives by 2030",
      "The real story behind Kakatiya Dynasty and Ramappa Temple"
    ];

    function generateRandomTopic() {
      const randomIndex = Math.floor(Math.random() * sampleTopics.length);
      document.getElementById("topic").value = sampleTopics[randomIndex];
    }

    function switchTab(tabId, evt) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      evt.currentTarget.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    async function generateShort() {
      const topic = document.getElementById("topic").value.trim();
      const duration = document.getElementById("duration").value;
      const language = document.getElementById("language").value;
      const tone = document.getElementById("tone").value;
      const genBtn = document.getElementById("genBtn");
      const spinner = document.getElementById("spinner");
      const tabsContainer = document.getElementById("tabsContainer");

      if (!topic) return alert("Please enter a topic or click Random Topic!");

      genBtn.disabled = true;
      spinner.style.display = "block";
      tabsContainer.style.display = "none";

      try {
        const response = await fetch("https://yt-shorts-api.nvrsarma.workers.dev/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ topic, duration, language, tone })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error);

        let storyContent = data.full_story;
        if (!storyContent && Array.isArray(data.scene_breakdown)) {
          storyContent = data.scene_breakdown.map(s => s.voiceover).join(" ");
        }

        renderFullStory(storyContent || "No story generated.");
        renderLanguageVoiceover(data.translated_voiceover || storyContent, language);
        renderScenes(data.scene_breakdown);
        renderCharacterSheets(data.character_sheets);
        renderHookCTA(data.hook, data.call_to_action, data.titles, data.description, data.tags);

        tabsContainer.style.display = "block";
      } catch (err) {
        alert("Error: " + err.message);
      } finally {
        genBtn.disabled = false;
        spinner.style.display = "none";
      }
    }

    function renderFullStory(story) {
      document.getElementById("tab-story").innerHTML = `<h3>📖 Complete Narrative Story</h3><p style="font-size:16px; line-height:1.8;">${story}</p>`;
    }

    function renderLanguageVoiceover(text, lang) {
      document.getElementById("tab-lang").innerHTML = `
        <h3>🎙️ ${lang} Voiceover Script</h3>
        <p class="telugu-text">${text}</p>
      `;
    }

    function renderScenes(scenes) {
      let html = "<h3>🎬 Scene Breakdown</h3>";
      if (Array.isArray(scenes)) {
        scenes.forEach((scene, index) => {
          html += `
            <div class="scene-box">
              <div class="scene-title">Scene ${index + 1} (${scene.timeframe || '0:10'})</div>
              <p><strong>Voiceover:</strong> ${scene.voiceover}</p>
              <p><strong>Visual Prompt:</strong> <em>${scene.visual_prompt}</em></p>
              <p><span class="badge">Text on Screen</span> ${scene.text_on_screen}</p>
            </div>
          `;
        });
      } else {
        html += "<p>No scene breakdown available.</p>";
      }
      document.getElementById("tab-scenes").innerHTML = html;
    }

    function renderCharacterSheets(chars) {
      let html = "<h3>👤 Character Sheets</h3>";
      if (Array.isArray(chars) && chars.length > 0) {
        chars.forEach(c => {
          html += `
            <div class="char-card">
              <h4>${c.name} ${c.role ? '(' + c.role + ')' : ''}</h4>
              <p><strong>Visual Description:</strong> ${c.appearance || 'N/A'}</p>
              <p><strong>Personality:</strong> ${c.personality || 'N/A'}</p>
            </div>
          `;
        });
      } else {
        html += "<p>No character descriptions required for this concept.</p>";
      }
      document.getElementById("tab-chars").innerHTML = html;
    }

    function renderHookCTA(hook, cta, titles, desc, tags) {
      let titleHtml = Array.isArray(titles) ? titles.map(t => `<li>${t}</li>`).join('') : '';
      let tagHtml = Array.isArray(tags) ? tags.map(t => `<span class="badge">#${t}</span> `).join('') : '';

      document.getElementById("tab-hook").innerHTML = `
        <h3>🪝 Opening Hook</h3>
        <div class="scene-box"><p class="telugu-text" style="color:#00ff66;">"${hook || ''}"</p></div>
        
        <h3>📢 Call To Action (CTA)</h3>
        <div class="scene-box"><p>"${cta || ''}"</p></div>

        <h3>📌 Title Ideas</h3>
        <ul>${titleHtml}</ul>

        <h3>📝 YouTube Description & Tags</h3>
        <p>${desc || ''}</p>
        <div>${tagHtml}</div>
      `;
    }
  </script>
</body>
</html>
