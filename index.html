<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free YouTube Shorts Generator</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 650px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #ff0000; color: white; font-weight: bold; border: none; cursor: pointer; }
    button:hover { background: #cc0000; }
    pre { background: #f4f4f4; padding: 15px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>🎬 AI YouTube Shorts Generator</h2>
  
  <label for="topic">Topic / Idea:</label>
  <input type="text" id="topic" placeholder="e.g., 3 Crazy Facts About Space">

  <label for="tone">Tone:</label>
  <select id="tone">
    <option value="exciting">Exciting / Energetic</option>
    <option value="dramatic">Dramatic / Mysterious</option>
    <option value="educational">Educational / Informative</option>
    <option value="funny">Humorous / Funny</option>
  </select>

  <button onclick="generateScript()" id="btn">Generate Script</button>

  <h3>Output:</h3>
  <pre id="output">Your generated YouTube Short script will appear here...</pre>

  <script>
    async function generateScript() {
      const topic = document.getElementById("topic").value;
      const tone = document.getElementById("tone").value;
      const output = document.getElementById("output");
      const btn = document.getElementById("btn");

      if (!topic) return alert("Please enter a topic!");

      btn.disabled = true;
      btn.innerText = "Generating Script...";
      output.innerText = "Connecting to Cloudflare Worker & OpenRouter...";

      try {
        const response = await fetch("https://yt-shorts-api.nvrsarma.workers.dev/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ topic, tone })
        });

        const data = await response.json();
        output.innerText = JSON.stringify(data, null, 2);
      } catch (err) {
        output.innerText = "Error generating script: " + err.message;
      } finally {
        btn.disabled = false;
        btn.innerText = "Generate Script";
      }
    }
  </script>
</body>
</html>
