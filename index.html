<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YouTube Shorts AI Generator</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f9f9f9;
      color: #333;
    }
    h2 { color: #ff0000; }
    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    input, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 15px;
    }
    button {
      background-color: #ff0000;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s ease;
    }
    button:hover { background-color: #cc0000; }
    button:disabled { background-color: #aaa; cursor: not-allowed; }
    pre {
      background: #1e1e1e;
      color: #00ff66;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 14px;
      min-height: 100px;
    }
  </style>
</head>
<body>

  <h2>🎬 YouTube Shorts AI Generator</h2>
  <p>Generate viral scripts, hooks, and scene ideas using your Cloudflare Worker backend.</p>

  <div class="form-group">
    <label for="topic">Topic / Video Idea:</label>
    <input type="text" id="topic" placeholder="e.g., 3 Mind Blowing Space Facts">
  </div>

  <div class="form-group">
    <label for="tone">Tone:</label>
    <select id="tone">
      <option value="engaging">Engaging / Energetic</option>
      <option value="dramatic">Dramatic / Mysterious</option>
      <option value="educational">Educational / Informative</option>
      <option value="funny">Humorous / Funny</option>
    </select>
  </div>

  <button onclick="generateShort()" id="genBtn">Generate Script</button>

  <h3>Output:</h3>
  <pre id="output">Your generated short concept will appear here...</pre>

  <script>
    async function generateShort() {
      const topic = document.getElementById("topic").value.trim();
      const tone = document.getElementById("tone").value;
      const output = document.getElementById("output");
      const genBtn = document.getElementById("genBtn");

      if (!topic) {
        alert("Please enter a topic!");
        return;
      }

      genBtn.disabled = true;
      genBtn.innerText = "Generating Script...";
      output.innerText = "Contacting Worker & OpenRouter AI...";

      try {
        // Pointing to your deployed Cloudflare Worker API
        const response = await fetch("https://yt-shorts-api.nvrsarma.workers.dev/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ topic, tone })
        });

        const data = await response.json();
        output.innerText = JSON.stringify(data, null, 2);
      } catch (err) {
        output.innerText = "Error: " + err.message;
      } finally {
        genBtn.disabled = false;
        genBtn.innerText = "Generate Script";
      }
    }
  </script>

</body>
</html>
